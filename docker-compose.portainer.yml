# Variante para Portainer: mesma aplicação, com Caddy e Cloudflared
# opcional ao lado.
#
# Diferenças em relação ao docker-compose.yml: os dados e os logs ficam em
# volumes nomeados (sem bind mount no host) e o Caddy/Cloudflared são
# incluídos.

services:
  hashpanel:
    build:
      context: .
      dockerfile: Dockerfile
    image: hashpanel:latest
    container_name: hashpanel
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - MASTODON_URL=${MASTODON_URL}
      - CLIENT_KEY=${CLIENT_KEY}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PREFERRED_TIMEZONE=${PREFERRED_TIMEZONE:-America/Sao_Paulo}
      # O Caddy deste compose fica na rede privada do Docker e sobrescreve
      # o X-Forwarded-For com o endereço do cliente. Sem declarar a rede
      # aqui, os limites por IP viram um balde único para todos os
      # visitantes (200 req/15min, 10 posts/hora, compartilhados).
      # Com o túnel Cloudflared na frente, o Caddy vê o container do túnel
      # (não o visitante): veja o README para o ajuste do hop.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 2 * * *}
    volumes:
      - hashpanel_data:/app/data
      - hashpanel_logs:/app/logs
    networks:
      - hashpanel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    networks:
      - hashpanel-network
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from :80 --to hashpanel:3000
    depends_on:
      hashpanel:
        condition: service_healthy

  cloudflared:
    image: ghcr.io/jauderho/cloudflared:latest
    container_name: cloudflared_hash
    restart: unless-stopped
    networks:
      - hashpanel-network
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
    command: tunnel --no-autoupdate run --protocol http2 --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - caddy

networks:
  hashpanel-network:
    driver: bridge

volumes:
  hashpanel_data:
  hashpanel_logs:
  caddy_data:
  caddy_config:
