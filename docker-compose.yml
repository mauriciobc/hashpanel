services:
  hashpanel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hashpanel
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Carrega o .env do host (falha se o arquivo não existir).
    # As variáveis do ambiente do container sobrescrevem as do arquivo.
    env_file:
      - .env
    environment:
      # Mastodon (obrigatório)
      - MASTODON_URL=${MASTODON_URL}
      - CLIENT_KEY=${CLIENT_KEY}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - ACCESS_TOKEN=${ACCESS_TOKEN}
      # Servidor
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PREFERRED_TIMEZONE=${PREFERRED_TIMEZONE:-America/Sao_Paulo}
      # Confiar em um proxy (Caddy/nginx) entre o cliente e a aplicação
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Desempenho
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-30000}
      - RATE_LIMIT_DELAY_MS=${RATE_LIMIT_DELAY_MS:-1000}
      - MAX_API_PAGES=${MAX_API_PAGES:-20}
      - TOOTS_PER_PAGE=${TOOTS_PER_PAGE:-40}
      # Cache
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
      # CORS (obrigatório em produção)
      # Origem única:  CORS_ORIGIN=https://seu-dominio.com
      # Várias:        CORS_ORIGIN=https://a.com,https://b.com
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - hashpanel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  hashpanel-network:
    driver: bridge
