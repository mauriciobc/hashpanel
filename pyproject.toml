[project]
name = "hashpanel"
version = "1.0.0"
description = "Monitoramento de hashtags do Mastodon com dashboard web e bot de menções"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "ISC" }
dependencies = [
    "Mastodon.py>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "httpx>=0.27",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
hashpanel = "hashpanel.cli.main:main"
hashpanel-collect = "hashpanel.cli.collect:main"
hashpanel-server = "hashpanel.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hashpanel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
