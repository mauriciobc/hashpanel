name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    env:
      NODE_ENV: test
      # src/config validates these at import time; dummy values are enough for
      # the unit tests and keep CI independent of real Mastodon credentials.
      MASTODON_URL: https://example.com/api/v1/
      CLIENT_KEY: ci-client-key
      CLIENT_SECRET: ci-client-secret
      ACCESS_TOKEN: ci-access-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
